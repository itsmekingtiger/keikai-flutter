name: keikai
description: "KEIKAI 警戒 — a dark HQ/HUD design language for Flutter. Every widget is built from the widgets and rendering layers up: no Material, no Cupertino."
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.14.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: Zen Old Mincho
      fonts:
        - asset: fonts/ZenOldMincho-Black.ttf
          weight: 900
    - family: Noto Serif KR
      fonts:
        - asset: fonts/NotoSerifKR-Black.ttf
          weight: 900
    - family: Sofia Sans Extra Condensed
      fonts:
        - asset: fonts/SofiaSansExtraCondensed-SemiBold.ttf
          weight: 600
        - asset: fonts/SofiaSansExtraCondensed-Bold.ttf
          weight: 700
        - asset: fonts/SofiaSansExtraCondensed-ExtraBold.ttf
          weight: 800
    - family: IBM Plex Mono
      fonts:
        - asset: fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
    - family: IBM Plex Sans KR
      fonts:
        - asset: fonts/IBMPlexSansKR-Regular.ttf
          weight: 400
        - asset: fonts/IBMPlexSansKR-Medium.ttf
          weight: 500
        - asset: fonts/IBMPlexSansKR-Bold.ttf
          weight: 700
